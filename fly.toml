app = "american-pancakes-pos"
primary_region = "sin"

[build]

[env]
  NODE_ENV = "production"
  PORT = "3001"
  FLO_DEV_USER_DATA = "/data"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "pos_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
