app = 'american-pancakes-pos'
primary_region = 'sin'

[build]

[env]
  NODE_ENV = 'production'
  PORT = '8080'
  FLO_DEV_USER_DATA = '/data'

[[mounts]]
  source = 'pos_data'
  destination = '/data'
  auto_extend_size_threshold = 80
  auto_extend_size_increment = '1GB'
  auto_extend_size_limit = '10GB'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 2048
